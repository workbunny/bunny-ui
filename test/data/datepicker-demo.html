<div>
    <p class="fw-medium" style="margin-bottom:8px; font-size:13px; color:var(--black-shallow);">日期</p>
    <input class="bny-input" data-picker="date" placeholder="选择日期" style="max-width:240px; margin-bottom:14px;">
    <p class="fw-medium" style="margin-bottom:8px; font-size:13px; color:var(--black-shallow);">日期+时间</p>
    <input class="bny-input" data-picker="datetime" placeholder="选择日期时间" style="max-width:280px; margin-bottom:14px;">
    <p class="fw-medium" style="margin-bottom:8px; font-size:13px; color:var(--black-shallow);">时间</p>
    <input class="bny-input" data-picker="time" placeholder="选择时间" style="max-width:180px;">
</div>

<style>

                        margin-bottom: 16px;
                        transition: var(--transition);

                    &:hover .icon {
                        background: var(--default);
                        color: var(--white);

                    & h3 {
                        font-size: var(--font-size-16);
                        font-weight: var(--font-weight-semibold);
                        color: var(--black);

                        line-height: 1.6;

            padding: 0 24px 80px;

                color: var(--black-shallow);

                height: 44px;
                padding: 0 32px;
                font-size: var(--font-size);
                font-weight: var(--font-weight-semibold);
